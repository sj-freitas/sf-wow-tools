# The Guild Assistant Uploader (discord/assistant-uploader): its Mac and Windows installers, built
# on each system's own runner. A tag `uploader-v<version>` (the version in its package.json) also
# publishes them as a GitHub release, which the Upload keys page links to (releases/latest).
# Run it by hand (Actions, "Run workflow") to build the installers without releasing them.
name: Guild Assistant Uploader

on:
  push:
    tags: ['uploader-v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One system failing doesn't cancel the other's build (its log is worth having).
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: discord/assistant-uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord/assistant-uploader/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Not signed with a certificate (none yet): the Mac app is signed ad hoc.
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: uploader-${{ matrix.os }}
          path: |
            discord/assistant-uploader/release/*.dmg
            discord/assistant-uploader/release/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/uploader-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Guild Assistant Uploader ${{ github.ref_name }}
          files: installers/*
          body: |
            The Guild Assistant Uploader uploads your professions to Guild Assistant each time
            World of Warcraft saves them (the GuildAssistant Professions addon's file).

            - **Mac:** the `.dmg`. The first time, macOS may say it can't check the app: open
              System Settings, Privacy & Security, and click **Open Anyway**.
            - **Windows:** the `.exe`. If Windows protects your PC, click **More info**, then
              **Run anyway**.

            Then make an upload key on Guild Assistant (your menu, **Upload keys**) and paste it in.
