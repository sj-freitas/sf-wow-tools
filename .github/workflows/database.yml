# GuildAssistant Database's recipe data (addons/GuildAssistantDatabase/Data.lua), from the game's own
# data tables for WoW Forever (wago.tools), and what players found of how recipes are obtained
# (Found.lua, gathered by Guild Assistant from their GuildAssistant Professions). Every Monday, and by
# hand (Actions, "Database", "Run workflow"): builds both; when either changed, bumps the addon's patch
# version (with a CHANGELOG line), runs the addons' tests, and opens a pull request with it. Nothing
# changed: no pull request. Publishing the new version stays a person's step (npm run
# publish:curseforge). Needs "Allow GitHub Actions to create and approve pull requests" on (repo
# Settings, Actions, General).
name: Database

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addons/package-lock.json
      - run: npm ci
      - run: npm run database -- --bump
      - run: npm test
      - id: data
        run: |
          echo "version=$(sed -n 's/^## Version: //p' GuildAssistantDatabase/GuildAssistantDatabase.toc)" >> "$GITHUB_OUTPUT"
          echo "build=$(sed -n 's/^ *build = "\(.*\)",$/\1/p' GuildAssistantDatabase/Data.lua)" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: database/update
          delete-branch: true
          add-paths: |
            addons/GuildAssistantDatabase/Data.lua
            addons/GuildAssistantDatabase/Found.lua
            addons/GuildAssistantDatabase/GuildAssistantDatabase.toc
            addons/GuildAssistantDatabase/CHANGELOG.md
          commit-message: 'GuildAssistant Database ${{ steps.data.outputs.version }}: recipe data (game build ${{ steps.data.outputs.build }}) and what players found'
          title: 'GuildAssistant Database ${{ steps.data.outputs.version }}: recipe data and what players found'
          body: |
            The game's data tables for WoW Forever (build ${{ steps.data.outputs.build }}) or what players found of how recipes are obtained changed, so `Data.lua` and `Found.lua` were rebuilt (`npm run database -- --bump`), the addon's version bumped to ${{ steps.data.outputs.version }} with a CHANGELOG line, and the addons' tests run.

            **Review `Found.lua`'s changes before merging**: they come from players' files (vendors, trainers, zones as their game named them).

            To ship it: merge, then from `addons/`: `npm run publish:curseforge -- GuildAssistantDatabase`.
