<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guild Assistant — a helper for World of Warcraft guilds on Discord</title>
    <meta
      name="description"
      content="Guild Assistant: a fan-made helper for World of Warcraft guilds on Discord — roster, scheduled raid sign-ups, officer messages and spam protection."
    />
    <!-- The public landing page; usePageMeta updates this (and robots) per page once the app runs. -->
    <link rel="canonical" href="https://guildassistant.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6d43c2" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- How the link looks when shared (Discord, social networks, chat apps). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Guild Assistant" />
    <meta property="og:title" content="Guild Assistant" />
    <meta
      property="og:description"
      content="A fan-made helper for World of Warcraft guilds on Discord: roster, scheduled raid sign-ups, officer messages and spam protection."
    />
    <meta property="og:url" content="https://guildassistant.app/" />
    <meta property="og:image" content="https://guildassistant.app/logo.png" />
    <meta property="og:image:width" content="256" />
    <meta property="og:image:height" content="256" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Guild Assistant is a fan-made helper for World of Warcraft guilds on Discord. It needs
      JavaScript to run.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
