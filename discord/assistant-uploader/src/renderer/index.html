<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guild Assistant Uploader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!-- Short on words: what needs explaining is in tooltips. The window takes the content's height
       (no scrolling): main.ts sizes it to what the page reports. -->
  <body>
    <header class="head">
      <img class="logo" src="../../assets/logo.png" alt="" />
      <h1>Guild Assistant Uploader</h1>
    </header>

    <!-- The upload key: the first step, and the Change Upload Key… window. -->
    <form id="key-view" class="key" hidden>
      <label for="key-input">Upload key</label>
      <input
        id="key-input"
        type="password"
        placeholder="gak_…"
        autocomplete="off"
        spellcheck="false"
      />
      <p id="key-error" class="error" role="alert"></p>
      <div class="actions">
        <button
          id="get-key"
          type="button"
          class="btn"
          title="Opens Guild Assistant in your browser: make a key there, copy it and paste it here. It can only upload professions."
        >
          Get an upload key
        </button>
        <span class="spacer"></span>
        <button id="cancel-key" type="button" class="btn" hidden>Cancel</button>
        <button id="save-key" type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>

    <div id="main-view" hidden>
      <p id="status" class="status" role="status"></p>

      <section>
        <div class="section-head">
          <h2>Game folder</h2>
          <button
            id="upload-now"
            type="button"
            class="btn btn-sm"
            title="Uploads the files now, even if they haven’t changed."
          >
            Upload now
          </button>
        </div>
        <div class="row">
          <span id="folder" class="folder"></span>
          <button
            id="choose-folder"
            type="button"
            class="btn btn-sm"
            title="World of Warcraft’s folder: the one with _forever_ in it."
          >
            Choose…
          </button>
        </div>
        <ul id="files" class="files"></ul>
      </section>

      <section>
        <h2>In the background</h2>
        <div class="checks">
          <label id="background-label" class="check">
            <input id="background" type="checkbox" />
            Run in the background
          </label>
          <label class="check" title="Opens hidden, in the background, when you log in.">
            <input id="login" type="checkbox" />
            Start at login
          </label>
        </div>
      </section>
    </div>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
